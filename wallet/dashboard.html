<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoXaNa – Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="dashboard-root" class="app-shell">
  <header>
    <div>
      <div class="logo">⬡ CoXaNa</div>
      <div class="subtitle"><strong>Dashboard</strong> · All-in-One Universal Wallet</div>
    </div>
  </header>

  <div class="panel">
    <h2>Account</h2>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Address</div>
        <div class="value" id="dash-address" style="font-size:0.72rem;font-family:monospace;"></div>
      </div>
      <div class="stat-card">
        <div class="label">Balance</div>
        <div class="value" id="dash-balance">–</div>
      </div>
      <div class="stat-card">
        <div class="label">Nonce</div>
        <div class="value" id="dash-nonce">–</div>
      </div>
      <div class="stat-card">
        <div class="label">Network Difficulty</div>
        <div class="value" id="dash-difficulty">–</div>
      </div>
      <div class="stat-card">
        <div class="label">Estimated Hash Power</div>
        <div class="value" id="dash-hashpower">–</div>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-small btn-outline" id="btn-refresh">⟳ Refresh</button>
      <button class="btn btn-small btn-outline" id="btn-copy-addr-top">Copy Address</button>
      <button class="btn btn-small btn-outline" id="btn-back">↩ Back</button>
    </div>
    <div id="dash-msg"></div>
  </div>

  <div class="panel">
    <h2>Send CoX</h2>
    <div class="form-row">
      <label for="send-to">Recipient Address</label>
      <input type="text" id="send-to" placeholder="CoX…" />
    </div>
    <div class="form-row">
      <label for="send-amount">Amount (CoX)</label>
      <input type="number" id="send-amount" placeholder="0.00" min="0" step="0.01" />
    </div>
    <div class="form-row">
      <label>Transaction Fee</label>
      <div class="info-box">0.01 CoX (fixed)</div>
    </div>
    <button class="btn btn-green" id="btn-send">Sign &amp; Send</button>
    <div id="send-msg"></div>
  </div>

  <div class="panel">
    <h2>Receive</h2>
    <p class="hint">Share your address to receive CoX tokens.</p>
    <div class="info-row">
      <div class="info-box" id="recv-address"></div>
      <button class="btn btn-small btn-outline" id="btn-copy-addr">Copy</button>
    </div>
    <div id="recv-msg"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
