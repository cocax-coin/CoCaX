<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoXaNa – All-in-One Wallet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="entry-root" class="app-shell">

  <header>
    <div>
      <div class="logo">⬡ CoXaNa</div>
      <div class="subtitle">All-in-One Universal Wallet</div>
    </div>
  </header>

  <div class="panel">
    <h2>Create New Wallet</h2>
    <p class="hint">Generates a brand new private key and 12-word seed phrase.</p>
    <div class="form-row">
      <button class="btn" id="btn-generate">✦ Generate New Wallet</button>
    </div>
    <div id="generate-output" class="gen-output" style="display:none;">
      <label>Seed Phrase (12 words)</label>
      <div class="mnemonic-grid" id="generated-mnemonic"></div>
      <div class="form-row">
        <label>Address</label>
        <div class="info-box" id="generated-address"></div>
      </div>
      <div class="form-row">
        <label>Private Key (hex)</label>
        <div class="info-box" id="generated-privkey"></div>
      </div>
      <button class="btn btn-green" id="btn-use-generated">Proceed to Dashboard</button>
      <div id="generate-msg"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Import via Seed Phrase</h2>
    <p class="hint">Enter exactly 12 or 24 words from the approved word list.</p>
    <div class="form-row">
      <label for="import-seed">Seed Phrase</label>
      <textarea id="import-seed" placeholder="word1 word2 ... word12/24" rows="3"></textarea>
    </div>
    <button class="btn btn-green" id="btn-import-seed">Import Wallet</button>
    <div id="import-seed-msg"></div>
  </div>

  <div class="panel">
    <h2>Login via Private Key</h2>
    <p class="hint">Paste a 64-character hex private key.</p>
    <div class="form-row">
      <label for="login-privkey">Private Key (hex)</label>
      <input type="text" id="login-privkey" placeholder="64 hex chars" />
    </div>
    <button class="btn btn-green" id="btn-login-privkey">Login</button>
    <div id="login-privkey-msg"></div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
